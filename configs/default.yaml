# Default configuration.
# Values marked null are intentionally unset until the corresponding module is implemented.

pipeline:
  save_intermediates: false     # input, V, illumination, reflectance, gamma, CLAHE, mask, denoised, final
  output_dir: data/output
  output_format: png            # lossless format

retinex:
  epsilon: 0.001                # small positive constant to avoid division by zero (assumption, not in report)
  max_iterations: 50            # iteration cap (assumption, not in report)
  tolerance: 0.0001             # stop when max |change| in T and R falls below this (assumption)
  # alpha and beta come from initialize_retinex_parameters(mean_v), not from this file

enhancement:
  clahe_clip_limit: null
  clahe_tile_grid_size: null

denoising:
  dark_threshold: 0.3           # conservative threshold for pixels treated as very dark
  nlm_h: 10.0                   # Fast NLM filter strength tuned for stronger denoising inside dark regions
  nlm_template_window_size: 7   # OpenCV recommended template window size
  nlm_search_window_size: 21    # OpenCV recommended search window size
