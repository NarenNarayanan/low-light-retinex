# Default configuration (placeholders only).
# Each member fills in the values for the module they own.
# Values marked null are intentionally unset until that member implements them.

pipeline:
  save_intermediates: false     # input, V, illumination, reflectance, gamma, CLAHE, mask, denoised, final
  output_dir: data/output
  output_format: png            # lossless format

retinex:                        # owner: Dhinesh Babu C M
  epsilon: null                 # small positive constant to avoid division by zero
  max_iterations: null
  tolerance: null               # convergence threshold
  # alpha and beta come from initialize_retinex_parameters(mean_v), not from this file

enhancement:                    # owner: Sarvesh S
  clahe_clip_limit: null
  clahe_tile_grid_size: null

denoising:                      # owner: Chitteti Syam
  dark_threshold: null          # dark-region mask threshold on enhanced V
  nlm_h: null                   # Fast NLM filter strength
  nlm_template_window_size: null
  nlm_search_window_size: null
